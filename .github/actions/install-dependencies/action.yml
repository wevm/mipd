name: "Install dependencies"
description: "Prepare repository and all dependencies"

runs:
  using: "composite"
  steps:
    - name: Set up pnpm
      uses: wevm/actions/vendor/pnpm/action-setup/v6@e0e99cfdac7c74eadc3ee7281015c0bf0496d6ac # v1.0.4

    - name: Set up node
      uses: actions/setup-node@v7
      with:
        cache: pnpm
        node-version: 18

    - name: Install dependencies
      shell: bash
      run: pnpm install --ignore-scripts